<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital waterfall banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9dd7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dropGradSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d1d9" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c9d1d9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9d1d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .stream { filter: url(#glow); }
      @keyframes fall {
        0%   { transform: translateY(-220px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      .s1  { animation: fall 2.4s linear infinite; }
      .s2  { animation: fall 3.1s linear infinite; animation-delay: .3s; }
      .s3  { animation: fall 1.9s linear infinite; animation-delay: .6s; }
      .s4  { animation: fall 2.7s linear infinite; animation-delay: .1s; }
      .s5  { animation: fall 3.4s linear infinite; animation-delay: .9s; }
      .s6  { animation: fall 2.1s linear infinite; animation-delay: 1.2s; }
      .s7  { animation: fall 2.9s linear infinite; animation-delay: .45s; }
      .s8  { animation: fall 2.3s linear infinite; animation-delay: 1.5s; }
      .s9  { animation: fall 3.6s linear infinite; animation-delay: .75s; }
      .s10 { animation: fall 2.0s linear infinite; animation-delay: 1.8s; }
      .s11 { animation: fall 2.8s linear infinite; animation-delay: .2s; }
      .s12 { animation: fall 3.2s linear infinite; animation-delay: 1.1s; }
      .s13 { animation: fall 2.5s linear infinite; animation-delay: 1.6s; }
      .s14 { animation: fall 2.2s linear infinite; animation-delay: .5s; }
      .s15 { animation: fall 3.0s linear infinite; animation-delay: 1.35s; }
      .s16 { animation: fall 2.6s linear infinite; animation-delay: .85s; }
      .title { font-family: 'Courier New', monospace; letter-spacing: 6px; fill: #e6edf3; }
      .sub   { font-family: 'Courier New', monospace; letter-spacing: 3px; fill: #58a6ff; }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        48% { opacity: 1; }
        50% { opacity: .55; }
        52% { opacity: 1; }
      }
      .flicker { animation: flicker 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <g class="stream">
    <rect class="s1"  x="40"   y="0" width="2" height="70" fill="url(#dropGrad)"/>
    <rect class="s2"  x="120"  y="0" width="1.5" height="55" fill="url(#dropGradSilver)"/>
    <rect class="s3"  x="200"  y="0" width="2" height="90" fill="url(#dropGrad)"/>
    <rect class="s4"  x="280"  y="0" width="1.5" height="60" fill="url(#dropGradSilver)"/>
    <rect class="s5"  x="360"  y="0" width="2" height="75" fill="url(#dropGrad)"/>
    <rect class="s6"  x="440"  y="0" width="1.5" height="50" fill="url(#dropGradSilver)"/>
    <rect class="s7"  x="520"  y="0" width="2" height="85" fill="url(#dropGrad)"/>
    <rect class="s8"  x="600"  y="0" width="1.5" height="65" fill="url(#dropGradSilver)"/>
    <rect class="s9"  x="680"  y="0" width="2" height="70" fill="url(#dropGrad)"/>
    <rect class="s10" x="760"  y="0" width="1.5" height="55" fill="url(#dropGradSilver)"/>
    <rect class="s11" x="840"  y="0" width="2" height="90" fill="url(#dropGrad)"/>
    <rect class="s12" x="920"  y="0" width="1.5" height="60" fill="url(#dropGradSilver)"/>
    <rect class="s13" x="1000" y="0" width="2" height="80" fill="url(#dropGrad)"/>
    <rect class="s14" x="1080" y="0" width="1.5" height="50" fill="url(#dropGradSilver)"/>
    <rect class="s15" x="1140" y="0" width="2" height="75" fill="url(#dropGrad)"/>
    <rect class="s16" x="960"  y="0" width="1.5" height="65" fill="url(#dropGradSilver)"/>
  </g>

  <text x="600" y="105" text-anchor="middle" class="title flicker" font-size="34" font-weight="700">PARAS&#160;KASHYAP</text>
  <text x="600" y="140" text-anchor="middle" class="sub" font-size="15">MOBILE&#160;APP&#160;DEVELOPER&#160;//&#160;CROSS-PLATFORM&#160;ARCHITECT</text>

  <line x1="300" y1="160" x2="900" y2="160" stroke="#30363d" stroke-width="1"/>
  <circle cx="600" cy="160" r="3" fill="#58a6ff" class="flicker"/>
</svg>
