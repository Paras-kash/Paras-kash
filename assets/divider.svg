<svg width="100%" height="14" viewBox="0 0 900 14" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="g4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="meshCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvasClip"><rect x="0" y="0" width="900" height="14"/></clipPath>
    <style>
      @keyframes drift { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -60; } }
      .glowline { stroke: url(#lineGrad); stroke-width: 1.4; filter: url(#g4); stroke-dasharray: 4 10; animation: drift 3s linear infinite; }
      @keyframes meshSlide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(120px); } }
      .meshDot { animation: meshSlide 9s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#canvasClip)">
    <ellipse class="meshDot" cx="450" cy="7" rx="200" ry="10" fill="url(#meshCyan)"/>
  </g>
  <line class="glowline" x1="0" y1="7" x2="900" y2="7"/>
</svg>
