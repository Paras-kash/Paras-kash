<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated Flutter Dash doodle">
  <defs>
    <linearGradient id="dashBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="meshCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshSilver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9d1d9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9d1d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshDeep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvasClip"><rect x="0" y="0" width="180" height="180"/></clipPath>
    <style>
      @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-15px); } }
      @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-19px,13px); } }
      @keyframes driftC { 0%,100% { transform: translate(0,0); } 50% { transform: translate(15px,17px); } }
      .meshA { animation: driftA 11s ease-in-out infinite; }
      .meshB { animation: driftB 14s ease-in-out infinite; }
      .meshC { animation: driftC 17s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      @keyframes wingFlap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
      .floaty { animation: float 3.2s ease-in-out infinite; transform-origin: center; }
      .eye { animation: blink 4.5s ease-in-out infinite; transform-origin: center; }
      .wing { animation: wingFlap 1.4s ease-in-out infinite; transform-origin: 95px 95px; }
    </style>
  </defs>

  <rect width="180" height="180" fill="#000000"/>
  <g clip-path="url(#canvasClip)">
    <ellipse class="meshA" cx="50" cy="45" rx="95" ry="75" fill="url(#meshCyan)"/>
    <ellipse class="meshB" cx="135" cy="130" rx="100" ry="80" fill="url(#meshSilver)"/>
    <ellipse class="meshC" cx="95" cy="95" rx="105" ry="85" fill="url(#meshDeep)"/>
  </g>

  <g class="floaty" filter="url(#softGlow)">
    <!-- body -->
    <path d="M60 130 C40 110 40 70 75 55 C110 40 150 60 150 95 C150 125 120 140 95 138 C80 137 68 140 60 130 Z" fill="url(#dashBody)"/>
    <!-- wing -->
    <path class="wing" d="M95 95 C120 80 140 90 138 115 C120 118 100 112 95 95 Z" fill="#0d1117" opacity="0.5"/>
    <!-- eye -->
    <g class="eye">
      <circle cx="118" cy="82" r="7" fill="#0d1117"/>
      <circle cx="120" cy="79" r="2" fill="#ffffff"/>
    </g>
    <!-- beak -->
    <path d="M150 92 L166 96 L150 102 Z" fill="#f0f6fc"/>
    <!-- feet -->
    <path d="M85 138 L82 150 M95 138 L96 150" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
